<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wei Keong | Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="connect.css">
</head>
<body>
  <div class="page-bg"></div>

  <nav class="navbar">
    <a href="home.html" class="navbar-logo">
      <img src="images/logo.png" alt="Logo">
      <span class="logo-text">Wei<span>.</span>Keong</span>
    </a>
    <button class="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      <li><a href="home.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="skill.html">Skills</a></li>
      <li><a href="project.html">Projects</a></li>
      <li><a href="connect.html">Connect</a></li>
    </ul>
  </nav>

  <main class="page-content">
    <section class="connect-section">

      <!-- LEFT: Globe + Socials -->
      <div class="connect-left">
        <div class="globe-container">
          <div class="globe">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
          </div>
        </div>

        <div class="socials">
          <p class="section-label">Find Me On</p>
          <div class="social-links">
            <a href="https://www.instagram.com" target="_blank" class="social-link instagram">
              <img src="images/Insta.png" alt="Instagram">
              <span>Instagram</span>
            </a>
            <a href="https://www.facebook.com" target="_blank" class="social-link facebook">
              <img src="images/Fb.png" alt="Facebook">
              <span>Facebook</span>
            </a>
            <a href="https://www.linkedin.com" target="_blank" class="social-link linkedin">
              <img src="images/Linked.png" alt="LinkedIn">
              <span>LinkedIn</span>
            </a>
            <a href="https://t.me" target="_blank" class="social-link telegram">
              <img src="images/tele.png" alt="Telegram">
              <span>Telegram</span>
            </a>
            <a href="https://discord.com" target="_blank" class="social-link discord">
              <img src="images/discord.png" alt="Discord">
              <span>Discord</span>
            </a>
          </div>
        </div>
      </div>

      <!-- RIGHT: Form -->
      <div class="connect-right">
        <p class="section-label">Contact</p>
        <h2 class="section-title">Get in <span>Touch</span></h2>
        <p class="connect-sub">Have a project in mind or want to collaborate? Drop a message below.</p>

        <form class="contact-form" id="contactForm">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
          </div>
          <button type="submit" class="submit-btn">
            <span>Send Message</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </form>
      </div>
    </section>
  </main>

  <script src="shared.js"></script>
  <script src="connect.js"></script>
</body>
</html>
