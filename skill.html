<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <div class="page-bg"></div>

  <nav class="navbar">
    <a href="index.html" class="navbar-logo">
      <img src="images/logo.png" alt="Logo">
      <span class="logo-text">Wei<span>.</span>Keong</span>
    </a>
    <button class="hamburger" aria-label="Menu">

  <main class="page-content">

    <!-- TOOLS -->
    <section class="tools-section" id="tool-section">
      <div class="skills-header">
        <p class="section-label">Toolbox</p>
        <h2 class="section-title">Tools I Use</h2>
      </div>
      <div class="tool-grid">
        <div class="tool-card">
          <img src="images/VSC.png" alt="Visual Studio Code">
          <span>Visual Studio Code</span>
        </div>
        <div class="tool-card">
          <img src="images/Github.png" alt="Github">

        </div>
        <div class="tool-card">
          <img src="images/P5js.png" alt="P5.js">
          <span>P5.js</span>
        </div>
      </div>
    </section>

      <div class="skills-grid">

        <div class="skill-card" data-progress="83">
